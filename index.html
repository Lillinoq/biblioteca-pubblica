<script>
(function () {
  "use strict";
  var D = JSON.parse(document.getElementById("dati").textContent);
  var libri = D.libri || [], fumetti = D.fumetti || [];
  // le serie solo digitali hanno una sezione a parte
  var fisici = fumetti.filter(function (x) { return !x.digitale; });
  var digitali = fumetti.filter(function (x) { return x.digitale; });

  function el(tag, cls, testo) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (testo != null && testo !== "") n.textContent = testo;
    return n;
  }
  function unisci(parti, sep) {
    return parti.filter(function (p) { return p != null && p !== ""; }).join(sep);
  }
  function elenco(nomi) {
    if (!nomi || !nomi.length) return "";
    if (nomi.length === 1) return nomi[0];
    return nomi.slice(0, -1).join(", ") + " e " + nomi[nomi.length - 1];
  }
  function norm(t) {
    return String(t || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
  }
  function classeStato(s) { return s ? s.replace(/ /g, "-") : ""; }

  // Testo su cui cercare, una volta sola per voce
  libri.forEach(function (b) {
    var parti = [b.titolo, b.titolo_originale, b.autore, b.serie].concat(b.coautori || [], b.tag || []);
    (b.edizioni || []).forEach(function (e) {
      parti.push(e.titolo, e.editore, e.collana, e.isbn);
      parti = parti.concat(e.traduttori || []);
    });
    b._cerca = norm(parti.join(" "));
  });
  fumetti.forEach(function (x) {
    var o = x.origine || {}, i = x.italia || {};
    x._cerca = norm([x.titolo, x.titolo_originale, o.editore, o.paese, i.editore]
      .concat(x.autori || [], x.tag || [], x.variant || []).join(" "));
  });

  // Intestazione
  var sotto = document.getElementById("sottotitolo");
  sotto.appendChild(document.createTextNode(unisci([
    "Aggiornato al " + D.aggiornato,
    libri.length + (libri.length === 1 ? " libro" : " libri"),
    fumetti.length ? fumetti.length + " serie a fumetti" : ""
  ], " · ") + " · "));
  var pdf = el("a", "", "Scarica il PDF");
  pdf.href = "biblioteca.pdf";
  sotto.appendChild(pdf);

  // Senza fumetti il selettore del tipo non serve
  if (!fumetti.length) {
    document.getElementById("tipo").style.display = "none";
    document.querySelector('#stato option[value="in pari"]').remove();
  }
  if (!digitali.length) {
    document.querySelector('#tipo button[data-tipo="digitali"]').style.display = "none";
  }

  // Stato dei filtri, ricordato nell'indirizzo (#q=...&tipo=...&stato=...)
  var filtro = { q: "", tipo: "tutto", stato: "" };
  try {
    var h = new URLSearchParams(location.hash.slice(1));
    filtro.q = h.get("q") || "";
    filtro.tipo = h.get("tipo") || "tutto";
    filtro.stato = h.get("stato") || "";
  } catch (e) {}

  var cerca = document.getElementById("cerca");
  var selStato = document.getElementById("stato");
  var bottoni = document.querySelectorAll("#tipo button");
  cerca.value = filtro.q;
  selStato.value = filtro.stato;

  function corrisponde(voce) {
    if (filtro.stato && voce.stato !== filtro.stato) return false;
    var parole = norm(filtro.q).split(/\s+/).filter(Boolean);
    for (var i = 0; i < parole.length; i++) {
      if (voce._cerca.indexOf(parole[i]) < 0) return false;
    }
    return true;
  }

  // Una scheda: testata (autore/stato, titolo, serie) + campi etichettati
  function scheda(voce, sopra, titolo) {
    var a = el("article", "scheda " + classeStato(voce.stato));
    var t = el("div", "testata");
    var alta = el("div", "riga-alta");
    alta.appendChild(el("span", "", sopra));
    if (voce.stato) alta.appendChild(el("span", "stato", voce.stato));
    t.appendChild(alta);
    t.appendChild(titolo);
    a.appendChild(t);
    var dl = el("dl", "campi");
    a.appendChild(dl);
    a._campo = function (nome, valore, cls) {
      if (valore == null || valore === "") return;
      dl.appendChild(el("dt", "", nome));
      var dd = el("dd", cls || "");
      if (valore instanceof Node) dd.appendChild(valore); else dd.textContent = String(valore);
      dl.appendChild(dd);
    };
    a._testata = t;
    a._dl = dl;
    return a;
  }

  function copia(e, conTitolo) {
    var trad = elenco(e.traduttori);
    return unisci([
      conTitolo ? e.titolo : "",
      unisci([e.editore, e.collana, e.anno], ", "),
      trad ? "trad. " + trad : "",
      e.lingua && !/^(italiano|it)$/i.test(e.lingua) ? "in " + e.lingua : "",
      (e.formati || []).join(", "),
      e.posizione ? "posizione: " + e.posizione : "",
      e.prestato_a ? "prestato a " + e.prestato_a : ""
    ], " · ");
  }

  function schedaLibro(b) {
    var titolo = el("h4", "titolo", b.titolo);
    var a = scheda(b, b.autore, titolo);
    if (b.serie) a._testata.appendChild(el("p", "serie", unisci([b.serie, b.numero_serie], ", ")));
    var campo = a._campo;
    if (b.coautori) campo("Con", elenco(b.coautori));
    if (b.titolo_originale || b.anno_originale) {
      var orig = el("span");
      if (b.titolo_originale && b.titolo_originale !== b.titolo) {
        orig.appendChild(el("span", "originale", b.titolo_originale));
        if (b.anno_originale) orig.appendChild(document.createTextNode(", " + b.anno_originale));
      } else {
        orig.textContent = b.anno_originale || "";
      }
      campo("Originale", orig);
    }
    var ed = b.edizioni || [];
    if (ed.length === 1) {
      var e = ed[0];
      if (e.titolo) campo("Titolo", e.titolo);
      campo("Edizione", unisci([e.editore, e.collana, e.anno], ", "));
      campo("Traduzione", elenco(e.traduttori));
      if (e.lingua && !/^(italiano|it)$/i.test(e.lingua)) campo("Lingua", e.lingua);
      campo("Formato", (e.formati || []).join(", "));
      campo("ISBN", e.isbn);
      campo("Posizione", e.posizione);
      campo("Prestato a", e.prestato_a);
    } else if (ed.length > 1) {
      var ol = el("ol", "copie");
      ed.forEach(function (e) { ol.appendChild(el("li", "", copia(e, true))); });
      campo(ed.length + " copie", ol);
    }
    if (b.non_posseduto) campo("Copia", "non posseduta");
    if (b.letture) {
      campo(b.letture.length > 1 ? "Letture" : "Lettura",
            b.letture.map(function (l) { return l.replace(/^letto: /, ""); }).join("; "));
    }
    if (b.voto != null) campo("Voto", b.voto + "/10");
    if (b.tag) campo("Tag", b.tag.join(", "));
    if (b.note) a.appendChild(el("p", "nota", b.note));
    if (!a._dl.children.length) a._dl.remove();
    return a;
  }

  function schedaFumetto(x) {
    var titolo = el("h4", "titolo", x.titolo);
    if (x.abbonamento) titolo.appendChild(el("span", "abbonamento", "in abbonamento"));
    var a = scheda(x, elenco(x.autori) || "Fumetto", titolo);
    if (x.titolo_originale) a._testata.appendChild(el("p", "serie", x.titolo_originale));
    function pubbl(p, conPaese) {
      if (!p) return "";
      return unisci([conPaese ? p.paese : "", unisci([p.editore, p.edizione], ", "),
                     p.volumi != null ? p.volumi + " vol." : "",
                     p.capitoli != null ? p.capitoli + " cap." : "", p.stato], " · ");
    }
    var campo = a._campo;
    campo("Italia", pubbl(x.italia, false));
    campo("Origine", pubbl(x.origine, true));
    campo("Previsti", x.previsti != null ? x.previsti : "non noto");
    if (!x.non_posseduta) campo("Posseduti", x.posseduti || "nessuno");
    var va = x.variant || [];
    if (va.length === 1) {
      campo("Variant", va[0]);
    } else if (va.length > 1) {
      var ul = el("ul", "copie");
      va.forEach(function (v) { ul.appendChild(el("li", "", v)); });
      campo("Variant", ul);
    }
    campo("Letti", x.letti || "nessuno");
    campo("Capitoli letti", x.capitoli_letti);
    campo("Sei al", x.dove_sei);
    campo("Capitoli da leggere", x.capitoli_da_leggere);
    if (x.non_in_volume) campo("Non ancora in volume", "cap. " + x.non_in_volume);
    campo("Mancano", x.mancanti, "mancano");
    campo("Formato", (x.formati || []).join(", "));
    if (x.voto != null) campo("Voto", x.voto + "/10");
    if (x.tag) campo("Tag", x.tag.join(", "));
    campo("Conteggi al", x.verificato);
    if (x.note) a.appendChild(el("p", "nota", x.note));
    if (!a._dl.children.length) a._dl.remove();
    return a;
  }

  function disegna() {
    var main = document.getElementById("elenco");
    main.textContent = "";
    var tutto = filtro.tipo === "tutto";
    var mostraLibri = tutto || filtro.tipo === "libri";
    var mostraFisici = tutto || filtro.tipo === "fumetti";
    var mostraDigitali = tutto || filtro.tipo === "digitali";
    var trovatiL = mostraLibri ? libri.filter(corrisponde) : [];
    var trovatiF = mostraFisici ? fisici.filter(corrisponde) : [];
    var trovatiD = mostraDigitali ? digitali.filter(corrisponde) : [];
    var conFumetti = trovatiF.length || trovatiD.length;

    if (trovatiL.length) {
      if (conFumetti) main.appendChild(el("h2", "sezione", "Libri"));
      var autore = null, griglia = null;
      trovatiL.forEach(function (b) {
        if (b.autore !== autore) {
          autore = b.autore;
          main.appendChild(el("h3", "autore", autore));
          griglia = el("div", "griglia");
          main.appendChild(griglia);
        }
        griglia.appendChild(schedaLibro(b));
      });
    }
    function sezioneFumetti(titolo, trovati) {
      if (!trovati.length) return;
      main.appendChild(el("h2", "sezione", titolo));
      var g = el("div", "griglia");
      g.style.marginTop = "10px";
      trovati.forEach(function (x) { g.appendChild(schedaFumetto(x)); });
      main.appendChild(g);
    }
    sezioneFumetti("Fumetti", trovatiF);
    sezioneFumetti("Fumetti digitali", trovatiD);
    if (!trovatiL.length && !conFumetti) {
      main.appendChild(el("p", "vuoto", "Nessun risultato."));
    }

    var totale = (mostraLibri ? libri.length : 0) + (mostraFisici ? fisici.length : 0)
               + (mostraDigitali ? digitali.length : 0);
    var trovati = trovatiL.length + trovatiF.length + trovatiD.length;
    document.getElementById("conteggio").textContent =
      trovati === totale ? "" : trovati + " su " + totale;

    bottoni.forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-tipo") === filtro.tipo));
    });
    try {
      var p = new URLSearchParams();
      if (filtro.q) p.set("q", filtro.q);
      if (filtro.tipo !== "tutto") p.set("tipo", filtro.tipo);
      if (filtro.stato) p.set("stato", filtro.stato);
      var nuovo = p.toString();
      history.replaceState(null, "", nuovo ? "#" + nuovo : location.pathname + location.search);
    } catch (e) {}
  }

  cerca.addEventListener("input", function () { filtro.q = cerca.value; disegna(); });
  selStato.addEventListener("change", function () { filtro.stato = selStato.value; disegna(); });
  bottoni.forEach(function (b) {
    b.addEventListener("click", function () { filtro.tipo = b.getAttribute("data-tipo"); disegna(); });
  });
  disegna();
})();
</script>
</body>
</html>
